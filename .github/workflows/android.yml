name: android-apk
# Builds the Android app (Capacitor WebView around the 3D client) and uploads a debug APK as a workflow artifact.
# GitHub's Ubuntu runners already have the Android SDK, so nothing has to be installed on a developer machine.
on:
  workflow_dispatch:
  push:
    paths: ['web/**', 'src/sim/**', 'src/*-rules.js', 'game.contract.json', 'android-app/**', '.github/workflows/android.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm test
      - name: Copy the game into the app and sync Capacitor
        working-directory: android-app
        run: npm install && npm run sync
      - name: Gradle assembleDebug
        working-directory: android-app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: dao-den-long-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
