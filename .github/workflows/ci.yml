name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Headless smoke + determinism
        run: |
          for n in 1 2 3; do
            node src/headless.js --seed 9 --night $n --ticks 3000 --out a$n.jsonl
            node src/headless.js --seed 9 --night $n --ticks 3000 --out b$n.jsonl
            cmp a$n.jsonl b$n.jsonl
            tail -1 a$n.jsonl
          done
      - name: Soak (10 nights)
        run: node scripts/soak.js --seed 7 --nights 10 --out soak-ci.json && cat soak-ci.json | head -12
