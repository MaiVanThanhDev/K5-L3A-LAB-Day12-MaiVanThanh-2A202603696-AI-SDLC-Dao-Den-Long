name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dao-den-long   # the game lives in a subfolder of the repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Headless smoke + determinism
        run: |
          for n in 1 2 3; do
            node src/headless.js --seed 9 --night $n --ticks 3000 --out a$n.jsonl
            node src/headless.js --seed 9 --night $n --ticks 3000 --out b$n.jsonl
            cmp a$n.jsonl b$n.jsonl
            tail -1 a$n.jsonl
          done
