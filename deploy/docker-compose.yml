# Production on a VPS: game + PostgreSQL + Caddy (automatic HTTPS from Let's Encrypt when DOMAIN is a real domain).
#   cp deploy/env.example deploy/.env   # then edit: DOMAIN, POSTGRES_PASSWORD
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
# Only Caddy is published (80/443). The game and the database stay on the internal Docker network.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ddl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ddl
    volumes:
      - ddl-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddl -d ddl"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  game:
    build: ..
    environment:
      PORT: "5173"
      DATABASE_URL: postgres://ddl:${POSTGRES_PASSWORD}@db:5432/ddl
    volumes:
      - ddl-data:/app/data   # leaderboard file
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env (a domain, or :80 for plain HTTP on the IP)}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - game
    restart: unless-stopped

volumes:
  ddl-pg:
  ddl-data:
  caddy-data:
  caddy-config:
